[project]
name = "jjok-api"
version = "0.1.0"
description = "Jjok 백엔드 서버 (FastAPI). api: 메타데이터·도구 API, agent: LangGraph·LLM (M6~). DevDocs/05-agent-server.md, ADR-0012"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.148",
    "uvicorn[standard]>=0.54",
    "firebase-admin>=7.7",
    "pydantic>=2.12",
    "pydantic-settings>=2.16",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pyright>=1.1.414",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jjok"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/jjok/schema"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/jjok/schema"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emulator: Firebase Auth 에뮬레이터가 필요한 테스트 (FIREBASE_AUTH_EMULATOR_HOST)",
    "live: 실제 외부 API를 호출하는 테스트 (CI 기본 제외)",
]
