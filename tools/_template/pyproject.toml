# 새 도구를 만들 때: tools/_template 을 tools/<name> 으로 복사하고
#   1) name, [project.scripts], 패키지 디렉터리(tool_template) 이름을 바꾼다
#   2) core.py 에 로직과 입출력 모델을 작성한다
#   3) services/api/config/tools.toml 에 등록한다
# 형태(CLI / MCP / 내장) 선택 기준: DevDocs/adr/0010-tool-form-criteria.md
[project]
name = "tool-template"
version = "0.1.0"
description = "Jjok 도구 템플릿 (예시: 텍스트 반복)"
requires-python = ">=3.12"
dependencies = ["jjok-toolkit"]

[project.scripts]
tool-template = "tool_template.cli:main"
# MCP 가 필요해지면 (ADR-0010 M1~M4): mcp.py 를 추가하고 아래 진입점을 연다
# tool-template-mcp = "tool_template.mcp:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv.sources]
jjok-toolkit = { path = "../_toolkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_template"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
