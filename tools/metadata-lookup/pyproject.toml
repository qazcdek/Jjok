# 논문 메타데이터 조회 도구 (F-1.2, F-1.3, M1-04). 형태: CLI (ADR-0010 — 상태 없는 외부 API 조회)
[project]
name = "metadata-lookup"
version = "0.1.0"
description = "DOI·arXiv ID·제목으로 논문 메타데이터를 조회한다 (arXiv, Crossref, OpenAlex, Semantic Scholar)"
requires-python = ">=3.12"
dependencies = ["jjok-toolkit", "httpx>=0.28"]

[project.scripts]
metadata-lookup = "metadata_lookup.cli:main"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.17"]

[tool.uv.sources]
jjok-toolkit = { path = "../_toolkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_lookup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
markers = ["live: 실제 외부 API 를 호출 (기본 제외: -m 'not live')"]
addopts = "-m 'not live'"
