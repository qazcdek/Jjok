name: ci-api
on:
  pull_request:
    paths: ["services/api/**", "tools/**"]
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -m "not emulator and not live"

  api-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project services/api
      - run: >-
          pnpm exec firebase emulators:exec --only auth --project demo-jjok
          "cd services/api && uv run pytest -m emulator"

  tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [_template]
    defaults:
      run:
        working-directory: tools/${{ matrix.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . ../_toolkit
      - run: uv run ruff format --check . ../_toolkit
      - run: uv run pytest
