name: ci-e2e
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jjok/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @jjok/e2e test
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: e2e/test-results }
